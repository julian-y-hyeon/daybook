<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Daybook</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f3f0,#121417);--card:light-dark(#fff,#1a1d22);--ink:light-dark(#16181c,#eceef2);--mute:light-dark(#5d636e,#9aa1ad);--line:light-dark(#e3e5ea,#2a2e35);--acc:light-dark(#0a5cff,#5c95ff)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
form{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
h1{margin:0 0 18px;font-size:24px}
label{display:grid;gap:4px;font-size:14px;color:var(--mute);margin-bottom:12px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
button{width:100%;min-height:44px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.err{color:#e6261f;font-size:14px;min-height:1.5em;margin:10px 0 0}
</style>
</head>
<body>
<form id="f">
  <h1>Daybook</h1>
  <label>이메일<input name="email" type="email" autocomplete="username" required></label>
  <label>비밀번호<input name="pw" type="password" autocomplete="current-password" required></label>
  <button type="submit">로그인</button>
  <p class="err" id="err" aria-live="polite"></p>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
(async () => {
  const { data } = await DB.sb.auth.getSession();
  if (data.session) location.replace('calendar.html');
  const f = document.getElementById('f'), err = document.getElementById('err');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const b = f.querySelector('button'); b.disabled = true; err.textContent = '';
    const { error } = await DB.sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.pw.value });
    b.disabled = false;
    if (error) { err.textContent = '로그인하지 못했어요. 이메일과 비밀번호를 확인해 주세요.'; return; }
    location.replace('calendar.html');
  });
})();
</script>
</body>
</html>
