<!DOCTYPE html>
<html lang="ko" style="visibility:hidden">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#f4f3f0;--ink:#16181c;--mute:#5d636e;--line:#e3e5ea}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--ink:#eceef2;--mute:#9aa1ad;--line:#2a2e35}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 'IBM Plex Sans KR',-apple-system,system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:16px max(4vw,16px)}
header b{font-size:18px}
header button{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--mute);font:600 14px 'IBM Plex Sans KR',sans-serif;cursor:pointer}
main{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:8px max(4vw,16px) max(6vh,24px);max-width:1100px;width:100%;margin:0 auto;align-content:center}
.w{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:min(62vh,520px);padding:28px;border-radius:22px;text-decoration:none;overflow:hidden;transition:transform .2s}
.w:hover{transform:translateY(-3px)}
.w svg{position:absolute;top:28px;left:28px;width:64px;height:64px}
.w h2{margin:0;font-size:clamp(34px,5vw,52px);line-height:1.05}
.w p{margin:0;font-size:15px;opacity:.8}
.w ul{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0;padding:0;list-style:none}
.w li{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px}
.mo{background:#fff;color:#16181c;border:1px solid var(--line)}
.mo h2{font-weight:700}
.mo li{background:#eef3ff;color:#0a4fd8}
@media (prefers-color-scheme:dark){.mo{background:#1a1d22;color:#eceef2}.mo li{background:#1f2a44;color:#a9c4ff}}
.fa{background:radial-gradient(120% 80% at 90% 0%,#5a2b50,transparent 60%),#24131f;color:#efe9f2}
.fa h2{font-family:'Gowun Batang',serif;font-weight:700}
.fa li{background:rgba(255,122,89,.16);color:#ffb19c}
.w:focus-visible,header button:focus-visible{outline:3px solid #7aa7ff;outline-offset:3px}
@media(max-width:640px){main{grid-template-columns:minmax(0,1fr);align-content:start}.w{min-height:240px;padding:22px}.w svg{top:22px;left:22px;width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){.w{transition:none}.w:hover{transform:none}}
</style>
</head>
<body>
<header><b>Daybook</b><button type="button" id="out">로그아웃</button></header>
<main>
 <a class="w mo" href="calendar.html#modern">
  <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 58h52"/><path d="M12 58V26h14v32M26 58V10h16v48M42 58V32h10v26"/><path d="M31 18h6M31 26h6M31 34h6M31 42h6M16 34h6M16 42h6M46 40h2M46 48h2"/></g></svg>
  <h2>현대</h2><p>2026년</p>
  <ul><li>캘린더</li><li>문자</li><li>전화</li><li>기사</li></ul>
 </a>
 <a class="w fa" href="calendar.html#fantasy">
  <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M40 8a24 24 0 1 0 16 40A20 20 0 0 1 40 8z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M50 14v6M47 17h6" stroke="currentColor" stroke-width="2"/></svg>
  <h2>판타지</h2><p>제국력 1123년</p>
  <ul><li>캘린더</li><li>편지</li></ul>
 </a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
(async () => {
  await DB.requireLogin();
  document.getElementById('out').addEventListener('click', DB.logout);
})();
</script>
</body>
</html>
